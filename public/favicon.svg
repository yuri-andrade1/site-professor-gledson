<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#040817" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#blueGrad)" stroke-width="12" stroke-opacity="0.4" />
  
  <!-- Philosophy Symbol / Elegant Greek Phi (Φ) -->
  <!-- Vertical line -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="url(#blueGrad)" stroke-width="36" stroke-linecap="round" />
  <!-- Center circle of Phi -->
  <ellipse cx="256" cy="256" rx="100" ry="110" fill="none" stroke="url(#blueGrad)" stroke-width="36" />
</svg>
