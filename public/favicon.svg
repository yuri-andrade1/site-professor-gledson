<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081a2e" />
      <stop offset="100%" stop-color="#030d17" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db" />
      <stop offset="100%" stop-color="#16527d" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#oceanGrad)" stroke-width="14" stroke-opacity="0.4" />
  
  <!-- Elegant Serif Letter G -->
  <text x="256" y="360" font-family="'Fraunces', 'Georgia', 'Times New Roman', serif" font-size="330" font-weight="900" text-anchor="middle" fill="url(#oceanGrad)">G</text>
</svg>
